name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraRename-0.1.0
          path: build/libs/MiraRename-0.1.0.jar
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 build/libs/MiraRename-0.1.0.jar --clobber
          else
            gh release create v0.1.0 build/libs/MiraRename-0.1.0.jar --target "${{ github.sha }}" --title "MiraRename v0.1.0" --notes "Adds two-stage item name tags: right-click to enter a name in chat, then click the prepared tag onto an item to rename it. MiraItems identities are preserved when possible."
          fi
