name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraRename-0.1.1
          path: build/libs/MiraRename-0.1.1.jar
          if-no-files-found: error
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 build/libs/MiraRename-0.1.1.jar --clobber
          else
            gh release create v0.1.1 build/libs/MiraRename-0.1.1.jar --target "${{ github.sha }}" --title "MiraRename v0.1.1" --notes "Fixes rename-tag right-click-in-air handling and adds legacy ampersand color/format code support for entered item names."
          fi
